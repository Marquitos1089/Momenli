/* Layout: schmale App-Spalte mit Tab-Leiste unten. Momente als Liste, Cover sind Typografie (Alter in Monaten) statt Fotos. Film als dunkle Bühne. */
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --ink:#1F2A26; --muted:#66736D; --line:#E4E8E3;
  --accent:#19805F; --accent-ink:#FFFFFF; --accent-soft:#D4F2E5; --ok:#4E9A6B;
  --mint:#6FD3AE; --mint-ink:#0F3D2D; --mint-soft:#D4F2E5; --mint-text:#17654A; --mint-line:#3FB88A;
  --cv-s:70%; --cv-l:92%; --cv-l2:86%; --cv-ink:#24302B;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
/* Immer hell (warm und cremig), auch wenn das Handy im Dunkelmodus ist. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:20px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.brand{font:700 1.05rem var(--font-display);letter-spacing:-.02em}
.brand i{color:var(--accent);font-style:normal}
.tag{font-size:.78rem;color:var(--muted)}
h1{font:700 clamp(2.4rem,11vw,3.1rem)/1 var(--font-display);letter-spacing:-.035em;margin:0}
.lede{color:var(--muted);margin:8px 0 0}
.h2{font:700 1.15rem var(--font-display);letter-spacing:-.01em;margin:30px 0 12px}
.label{font:600 .72rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}

.strip,.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.strip::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.mchip{flex:none;width:44px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .95rem var(--font-display);cursor:pointer}
.mchip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.mchip.now{border:2px solid var(--accent)}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 .85rem var(--font-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-weight:600;opacity:.6;margin-left:4px}

.gh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px;font:700 1.05rem var(--font-display);scroll-margin-top:14px}
.gh span{font:400 .8rem var(--font-body);color:var(--muted)}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;margin-bottom:10px;cursor:pointer}
.row:hover{border-color:var(--muted)}
.row h3{font:600 1rem/1.25 var(--font-body);margin:0}
.meta{font-size:.78rem;color:var(--muted);margin:2px 0 4px}
.nt{font-size:.86rem;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}

.cover{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;background:hsl(var(--h) var(--cv-s) var(--cv-l));color:var(--cv-ink)}
.cover::before{content:"";position:absolute;z-index:-1;width:80%;aspect-ratio:1;border-radius:50%;top:-28%;right:var(--ax,-10%);background:hsl(var(--h) var(--cv-s) var(--cv-l2))}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.cn{font:700 var(--cn,1.7rem)/.9 var(--font-display);letter-spacing:-.04em}
.cu{font:600 var(--cu,.7rem) var(--font-body);letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:4px}
.cb,.cs2{position:absolute;top:8px;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--surface);color:var(--ink)}
.cb{left:8px}.cs2{right:8px;color:var(--accent)}
.cover.sm{width:76px;height:76px;border-radius:18px;padding:9px 10px;--cn:1.7rem}
.cover.sm .cu{display:none}
.cover.lg{width:100%;aspect-ratio:4/3;border-radius:24px;padding:20px;--cn:5.6rem;--cu:.85rem}
.cover.lg .cb,.cover.lg .cs2{top:14px;width:32px;height:32px;border-radius:10px}
.cover.lg .cb{left:14px}.cover.lg .cs2{right:14px}

.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 .7rem var(--font-body);padding:6px 0;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent)}
.fabwrap{display:flex;justify-content:center}
.fab{width:54px;height:54px;border-radius:19px;background:var(--accent);color:var(--accent-ink);border:0;margin-top:-22px;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 22px rgba(25,128,95,.3)}

.primary{width:100%;padding:15px;border-radius:16px;background:var(--accent);color:var(--accent-ink);border:0;font:600 1rem var(--font-body);cursor:pointer;margin-top:18px}
.ghost{padding:10px 14px;border-radius:12px;background:none;border:1px solid var(--line);font:500 .85rem var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}

.scrim{position:fixed;inset:0;background:rgba(10,11,25,.55);z-index:30}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding-top:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;animation:up .28s ease both}
@keyframes up{from{transform:translate(-50%,28px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh-head h2{font:700 1.3rem var(--font-display);letter-spacing:-.02em;margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.segb{padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 .8rem var(--font-body);color:var(--muted);cursor:pointer}
.segb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;border:1.5px dashed var(--line);border-radius:20px;color:var(--muted);cursor:pointer;margin-top:14px;padding:12px;text-align:center;overflow:hidden}
.drop img{width:100%;max-height:190px;object-fit:cover;border-radius:12px}
label.fl{display:block;font:600 .78rem var(--font-body);color:var(--muted);margin:14px 0 6px}
.fld{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.fld:focus{border-color:var(--accent)}
textarea.fld{resize:vertical;min-height:84px}
.err{color:var(--accent);font-size:.85rem;margin:8px 0 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font:500 .9rem var(--font-body);z-index:50;animation:up .25s ease both;max-width:calc(100% - 32px)}
.wave{display:flex;align-items:center;gap:3px;height:44px;margin:14px 0 4px}
.wave i{flex:1;border-radius:2px;background:var(--accent);opacity:.8}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 .78rem var(--font-body)}
.pill.n{background:var(--bg);color:var(--muted)}
.det h2{font:700 1.5rem/1.15 var(--font-display);letter-spacing:-.02em;margin:16px 0 4px}
.det .nt{display:block;font-size:1rem;color:var(--ink);margin-top:10px}

.ring{display:flex;align-items:center;gap:18px;margin:18px 0 6px}
.ring p{margin:0}
.ms{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.ms.open{cursor:pointer}
.mk{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.ms.done .mk{background:var(--ok);color:#fff}
.ms h3{font:600 .98rem/1.25 var(--font-body);margin:0}
.ms .meta{margin:2px 0 0}
.own{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 .68rem var(--font-body);vertical-align:1px}
.mini{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:none;font:600 .8rem var(--font-body);cursor:pointer;color:var(--ink)}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.dash{width:100%;padding:14px;border-radius:18px;border:1.5px dashed var(--line);background:none;color:var(--accent);font:600 .95rem var(--font-body);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 16px}
.card.pad{padding:16px}

.avatar{width:72px;height:72px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 2.2rem var(--font-display);margin-bottom:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pf{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.pf:last-child{border-bottom:0}
.pf label{font-size:.8rem;color:var(--muted)}
.pf input{border:0;background:none;color:var(--ink);font:500 1rem var(--font-body);padding:10px 0;width:100%;min-width:0}
.story{list-style:none;margin:0;padding:0}
.story li{position:relative;padding:0 0 22px 28px}
.story li::before{content:"";position:absolute;left:5px;top:10px;bottom:-4px;width:2px;background:var(--line)}
.story li:last-child{padding-bottom:0}.story li:last-child::before{display:none}
.story li::after{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.story li.now::after{background:var(--bg);border:2px solid var(--accent)}
.story strong{display:block;font:600 1rem var(--font-body)}
.story span{display:block;font-size:.8rem;color:var(--muted)}
.story p{margin:4px 0 0;font-size:.9rem}

.stage{--cv-s:34%;--cv-l:23%;--cv-l2:30%;--cv-ink:#F1EEFF;position:relative;aspect-ratio:4/5;border-radius:26px;overflow:hidden;background:#12142A;color:#F4F2FF;margin-top:20px}
.stage .sc{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:28px;animation:fade .45s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09)}}
.sc h2{font:700 clamp(2.8rem,14vw,4.2rem)/.95 var(--font-display);letter-spacing:-.04em;margin:10px 0}
.eyebrow{font:600 .75rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#A8E8D0;margin:0}
.sc .lead{font-size:1.15rem;margin:0}
.sc .sub{color:#B9BAD6;margin:6px 0 0}
.sc-mem{padding:0!important;justify-content:flex-end!important}
.kb{position:absolute;inset:0;animation:kb var(--dur,2s) ease-out both}
.stage .cover{position:absolute;inset:0;width:100%;height:100%;border-radius:0;justify-content:flex-start;padding:9% 8%;--cn:min(38vw,10rem);--cu:1rem}
.stage .cb{left:auto;right:18px;top:18px;width:34px;height:34px}
.cap{position:relative;z-index:1;padding:70px 22px 24px;background:linear-gradient(to top,rgba(10,11,25,.9),rgba(10,11,25,0))}
.cap h3{font:700 1.8rem/1.05 var(--font-display);letter-spacing:-.03em;margin:8px 0 4px;color:#fff}
.cap p{margin:0;color:#D5D6EA;font-size:.9rem}
.cap .pill{background:#6FD3AE;color:#0F3D2D}
.fp{position:absolute;top:0;left:0;height:4px;width:0;background:#6FD3AE;z-index:3}
.bigplay{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,11,25,.5);border:0;color:#fff;font:600 1rem var(--font-body);cursor:pointer}
.stage[data-state="idle"] .bigplay,.stage[data-state="ended"] .bigplay{display:flex}
.bigplay span{width:76px;height:76px;border-radius:50%;background:#6FD3AE;color:#0F3D2D;display:grid;place-items:center}
.stage.paused .kb{animation-play-state:paused!important}
.ctrl{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.pbtn{flex:none;width:52px;height:52px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;cursor:pointer}
.scrub{flex:1;min-width:0}
.scrub input{width:100%;accent-color:var(--accent);margin:0}
.tl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.note{font-size:.82rem;color:var(--muted);margin:14px 0 0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* Ergänzungen: Speicherung, Medien, Export */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:18px;padding:12px 14px;margin:18px 0 0;font-size:.86rem}
.banner b{color:var(--accent)}
.banner button{flex:none;margin-left:auto;background:none;border:0;color:var(--accent);font:600 .82rem var(--font-body);cursor:pointer;padding:2px 0}
.det video{width:100%;max-height:60vh;border-radius:24px;background:#000;display:block}

function fmtDate(d){return d.getDate()+'. '+MON[d.getMonth()]+' '+d.getFullYear()}
function fmtShort(d){return d.getDate()+'. '+MABB[d.getMonth()]+' '+d.getFullYear()}
function ageMonths(d){var m=(d.getFullYear()-BIRTH.getFullYear())*12+d.getMonth()-BIRTH.getMonth();if(d.getDate()<BIRTH.getDate())m--;return Math.max(m,0)}
function ageDays(d){return Math.max(Math.round((d-BIRTH)/DAY),0)}
function ageText(d){
  var m=ageMonths(d);
  if(m<1){var n=ageDays(d);return n===0?'Tag der Geburt':(n===1?'1 Tag':n+' Tage')}
  if(m<12)return m===1?'1 Monat':m+' Monate';
  var y=Math.floor(m/12),r=m%12,ys=y===1?'1 Jahr':y+' Jahre';
  return r===0?ys:ys+', '+(r===1?'1 Monat':r+' Monate');
}
function mmss(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}

/* ---------- Dauerhafte Speicherung (IndexedDB, nur auf diesem Gerät) ---------- */
var DB=null,saveTimer=null;
function dbOpen(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej(new Error('kein IndexedDB'));return}
  var r=indexedDB.open('momenli',1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
})}
function dbReq(mode,fn){return new Promise(function(res,rej){
  if(!DB){res(null);return}
  var tx=DB.transaction('kv',mode),st=tx.objectStore('kv'),q=fn(st),out=null;
  if(q)q.onsuccess=function(){out=q.result};
  tx.oncomplete=function(){res(out)};tx.onerror=tx.onabort=function(){rej(tx.error)};
})}
function dbGet(k){return dbReq('readonly',function(s){return s.get(k)})}
function dbPut(k,v){return dbReq('readwrite',function(s){return s.put(v,k)})}
function dbDel(k){return dbReq('readwrite',function(s){return s.delete(k)})}
function dbClear(){return dbReq('readwrite',function(s){return s.clear()})}

  return {v:2,nextId:S.nextId,cur:S.cur,music:S.music,musicName:S.musicName,

      rit:JSON.parse(JSON.stringify(k.rit||emptyRit(),function(key,v){return key==='url'?undefined:v})),
      del:k.del||{},
      mem:k.mem.map(function(m){return {idea:m.idea||'',upd:m.upd||0,id:m.id,date:iso(m.date),type:m.type,title:m.title,note:m.note,ms:m.ms,ord:m.ord!=null?m.ord:undefined,story:m.story||undefined,img:m.img,hq:!!m.hq,pics:m.pics&&m.pics.length?m.pics.map(function(p,i){return {pid:p.pid,hq:!!p.hq,orig:!!p.orig,ed:p.ed||undefined,img:i?p.img:''}}):undefined,dur:m.dur,auto:m.auto,media:!!m.media,mime:m.mime||'',fname:m.fname||'',rit:m.rit||''}})}})};
}
function applySnap(o){
  S.nextId=o.nextId||100;S.music=o.music||'spieluhr';S.musicName=o.musicName||'';
  var kids=o.kids||[{kid:'k1',profile:o.profile,ms:o.ms,mem:o.mem,sample:o.sample}];/* alte Sicherungen mit einem Kind */
  S.kids=kids.map(function(k){var rt=k.rit||emptyRit();['letters','interviews'].forEach(function(x){rt[x]=rt[x]||{}});rt.measures=rt.measures||[];rt.qs=rt.qs||[];
    return {kid:k.kid,profile:k.profile||{},ms:k.ms||[],sample:!!k.sample,rit:rt,del:k.del||{},
    mem:(k.mem||[]).map(function(m){m.date=parseISO(m.date)||TODAY;return fillPics(m)})}});
  S.cur='';S.profile=null;
  var k0=null;for(var i=0;i<S.kids.length;i++)if(S.kids[i].kid===o.cur)k0=S.kids[i];k0=k0||S.kids[0];
  S.cur=k0.kid;S.profile=k0.profile;S.mem=k0.mem;S.ms=k0.ms;S.sample=k0.sample;setBirth();
}

async function loadMediaUrls(){
  var am=allMem();
  for(var i=0;i<am.length;i++){var m=am[i];
    if(m.media&&!m.url){try{var b=await dbGet('media:'+m.id);if(b)m.url=URL.createObjectURL(b);else m.media=false}catch(e){}}
  }
  var al=allLetters();
  for(var j=0;j<al.length;j++){var L=al[j];if(L.mediaId&&!L.url){try{var lb=await dbGet('media:'+L.mediaId);if(lb)L.url=URL.createObjectURL(lb);else L.mediaId=0}catch(e){}}}
  try{var mu=await dbGet('music');if(mu&&mu.blob)setCustomMusic(mu.blob,mu.name,true)}catch(e){}
}

/* Reihenfolge am selben Tag: ord (falls verschoben), sonst Anlege-Reihenfolge */
function okey(m){return m.ord!=null?m.ord:m.id}
function sameDay(m){var d=iso(m.date);return S.mem.filter(function(x){return iso(x.date)===d}).sort(function(a,b){return okey(a)-okey(b)})}
function orderHTML(m){var l=sameDay(m);if(l.length<2)return '';var i=l.indexOf(m);
  return '<div class="ordr"><span class="small">Reihenfolge an diesem Tag: '+(i+1)+' von '+l.length+'</span><div class="btns" style="margin-top:6px"><button class="ghost" data-act="mem-ord" data-id="'+m.id+'" data-v="-1"'+(i===0?' disabled':'')+'>↓ Früher am Tag</button><button class="ghost" data-act="mem-ord" data-id="'+m.id+'" data-v="1"'+(i===l.length-1?' disabled':'')+'>↑ Später am Tag</button></div></div>'}
function picsOf(m){if(m.pics&&m.pics.length)return m.pics;return m.img&&m.type==='f'?[{pid:m.id,img:m.img,hq:!!m.hq}]:[]}
function setPics(m,l){m.pics=l;m.img=l.length?l[0].img:null;m.hq=false}
function delPics(m){picsOf(m).forEach(function(p){if(p.hq)dbDel('photo:'+p.pid).catch(function(){});if(p.orig)dbDel('orig:'+p.pid).catch(function(){})})}
function sig(img){return img?img.length+':'+img.slice(-24):''}
function findPic(pid){var am=allMem();for(var i=0;i<am.length;i++){var m=am[i];if(m.pics){for(var j=0;j<m.pics.length;j++)if(String(m.pics[j].pid)===String(pid))return {m:m,p:m.pics[j]}}else if(m.type==='f'&&m.img&&String(m.id)===String(pid))return {m:m,p:null}}return null}
function fillPics(m){if(m.pics&&m.pics[0]&&!m.pics[0].img)m.pics[0].img=m.img;return m}
/* ---------- Cover ---------- */
function coverHue(m){return {f:210,v:265,s:150}[m.type]}
function coverAx(m){return (m.id*13)%36-16}
function cover(m,size){
  var h=coverHue(m),mo=ageMonths(m.date),big,lab;
  if(mo<1){big=ageDays(m.date);lab=big===1?'Tag':'Tage'}else{big=mo;lab=mo===1?'Monat':'Monate'}
  return '<div class="cover '+(size||'')+'" style="--h:'+h+';--ax:'+coverAx(m)+'%">'
   +(m.img?'<img src="'+m.img+'" alt="">':'')
   +'<span class="cb">'+ic(typeIcon(m.type),size==='lg'?18:14)+'</span>'
   +(m.ms?'<span class="cs2">'+ic('star',size==='lg'?18:14)+'</span>':'')
   +(m.pics&&m.pics.length>1?'<span class="cnt">'+m.pics.length+'</span>':'')
   +(m.img?'':'<span class="cn">'+big+'</span><span class="cu">'+lab+'</span>')+'</div>';
}

var NOTE={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,Fs5:739.99,G5:783.99,A5:880,B5:987.77,C6:1046.5};
function seq(s){return s.split(' ').map(function(x){var p=x.split(':');return [NOTE[p[0]]||0,+(p[1]||1)]})}
var TUNES={
  spieluhr:{name:'Spieluhr',w:'sine',beat:480,decay:1.3,vol:.09,notes:seq('C5 E5 G5 E5 A5 G5 E5 D5 C5 E5 G5 C6 A5 G5 E5 C5')},
  wiegenlied:{name:'Wiegenlied (Brahms)',w:'triangle',beat:420,decay:1.6,vol:.11,notes:seq('E4:.5 E4:.5 G4:2 E4:.5 E4:.5 G4:2 E4:.5 G4:.5 C5:1 B4:1.5 A4:.5 A4:1 G4:1 D4:.5 E4:.5 F4:1 D4:1 D4:.5 E4:.5 F4:2 D4:.5 F4:.5 B4:.5 A4:.5 G4:1 B4:1 C5:3')},
  froehlich:{name:'Fröhlich',w:'triangle',beat:240,decay:.55,vol:.07,notes:seq('G4 B4 D5 B4 C5 E5 G5 E5 D5 Fs5 A5 Fs5 G5 D5 B4 D5')}
};
var AC=null,BUS=null,mTimer=null,mIdx=0,custom={el:null,src:null,url:null};
function ensureAC(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();BUS=AC.createGain();BUS.connect(AC.destination)}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
  return !!AC;
}
function tone(f,T){
  if(!AC||!f)return;
  try{var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=T.w;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(T.vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+T.decay);
    o.connect(g);g.connect(BUS);o.start(t);o.stop(t+T.decay+.1);
  }catch(e){}
}
function musicStep(){
  var T=TUNES[S.music];if(!T){mTimer=null;return}
  var n=T.notes[mIdx%T.notes.length];mIdx++;tone(n[0],T);
  mTimer=setTimeout(musicStep,n[1]*T.beat);
}
function musicStart(fromStart){
  musicStop();
  if(S.music==='aus'||!ensureAC())return;
  if(fromStart)mIdx=0;
  if(S.music==='eigene'){
    if(!custom.el)return;
    if(!custom.src){try{custom.src=AC.createMediaElementSource(custom.el);custom.src.connect(BUS)}catch(e){}}
    if(fromStart)custom.el.currentTime=0;
    custom.el.play().catch(function(){});
    return;
  }
  musicStep();
}
function musicStop(){if(mTimer){clearTimeout(mTimer);mTimer=null}if(custom.el)custom.el.pause()}
function setCustomMusic(blob,name,quiet){
  if(custom.el){custom.el.pause();if(custom.src)try{custom.src.disconnect()}catch(e){}}
  if(custom.url)URL.revokeObjectURL(custom.url);
  custom.url=URL.createObjectURL(blob);custom.el=new Audio(custom.url);custom.el.loop=true;custom.src=null;
  S.musicName=name||'Eigene Musik';
  if(!quiet){S.music='eigene';save();dbPut('music',{blob:blob,name:S.musicName}).catch(function(){})}
}

function buildFilm(){
  if(S.filmMode==='tl')return buildTL();
  var list=S.mem.concat(ritFilmItems()).sort(function(a,b){return a.date-b.date||(a.kind?1:0)-(b.kind?1:0)||(a.kind?a.id-b.id:okey(a)-okey(b))});
  var mp=monthPhotos(),montaged=false;
  function montage(){if(montaged||mp.length<3)return;montaged=true;sc.push({k:'montage',d:1600+mp.length*450,items:mp})}
  var sc=[{k:'title',d:3200}];
  var bands=[[0,0,'Ankommen'],[1,3,'Staunen'],[4,6,'Entdecken'],[7,9,'In Bewegung'],[10,12,'Das erste Jahr'],[13,18,'Laufen lernen'],[19,999,'Kleine Person']];
  bands.forEach(function(b){
    var items=list.filter(function(m){var x=ageMonths(m.date);return x>=b[0]&&x<=b[1]});
    if(!items.length)return;
    var lo=ageMonths(items[0].date),hi=ageMonths(items[items.length-1].date);
    var range=hi===0?'Erster Monat':(lo===hi?'Monat '+lo:'Monat '+lo+'–'+hi);
    sc.push({k:'chapter',d:1800,name:b[2],range:range,n:items.filter(function(m){return !m.kind}).length});
    items.forEach(function(m){
      if(m.kind==='letter')sc.push({k:'letter',d:3200+Math.min((m.L.text||'').length,260)*16,y:m.y,L:m.L});
      else if(m.kind==='iv')sc.push({k:'iv',d:6500,y:m.y,pairs:ivPairs(m.I,4,m.y)});
      else{sc.push({k:'mem',d:m.ms?2400:1700,m:m});

    });

async function exportFilm(){

  filmStop();filmCtrl();

  openSheet(exportSheet());

  for(var i=0;i<F.sc.length;i++){var s=F.sc[i];if((s.k==='mem'||s.k==='tl')&&s.m.img&&!imgs[s.m.id])imgs[s.m.id]=await loadImg(s.m.img);if(s.k==='montage')for(var mi=0;mi<s.items.length;mi++)if(s.items[mi].img&&!imgs[s.items[mi].id])imgs[s.items[mi].id]=await loadImg(s.items[mi].img)}

    stream.getTracks().forEach(function(tr){if(tr.kind==='video')tr.stop()});
    if(!X||X.cancel){X=null;return}
    var type=(rec.mimeType||mime||'video/webm').split(';')[0],ext=type.indexOf('mp4')>=0?'mp4':'webm';
    var blob=new Blob(chunks,{type:type}),name=(F.mode==='tl'?'Momentitos_Zeitraffer_':'Momentitos_Film_')+first().replace(/[^\wäöüÄÖÜß-]+/g,'_')+'_'+iso(TODAY)+'.'+ext;
    download(blob,name);X=null;

  };

/* Was steht an? */
function dueItems(){
  var out=[],r=R(),mo=ageMonths(TODAY),y=ageYears(TODAY);
  if(mo<=mMax()){
    var m=mo,tag='monat-'+m;
    if(!ritMem(tag))out.push({t:ritLabel(tag),s:'Jetzt dran',act:'rit-photo',v:tag,since:addMonths(BIRTH,m)});
    else if(mo<mMax()){var nd=addMonths(BIRTH,m+1),dd=Math.round((nd-TODAY)/DAY);out.push({t:'Nächstes Monatsfoto',s:'In '+days(dd)+', am '+fmtShort(nd),act:'',v:'',soon:true})}
  }
  var nb=bday(y+1),dn=Math.round((nb-TODAY)/DAY);
  if(dn<=60)out.push({t:(y+1)+'. Geburtstag in '+days(dn),s:'Brief schreiben, Mini-Interview, Geburtstagsfoto',act:'rit-year',v:String(y+1),since:new Date(nb-21*DAY)});
  if(y>=1){
    var miss=[];if(!r.letters[y])miss.push('Brief');if(!r.interviews[y])miss.push('Interview');if(!ritMem('geb-'+y))miss.push('Foto');
    if(miss.length&&dn>60)out.push({t:'Zum '+y+'. Geburtstag fehlt noch',s:miss.join(', ')+'. Lässt sich nachtragen.',act:'rit-year',v:String(y),since:bday(y)});
  }
  var last=r.measures.slice().sort(function(a,b){return a.date<b.date?1:-1})[0],ld=last?parseISO(last.date):null,gap=ld?Math.round((TODAY-ld)/DAY):999;
  var every=mo<12?60:(mo<36?120:365);
  if(gap>=every)out.push({t:'Größe und Gewicht messen',s:ld?'Letzte Messung vor '+days(gap):'Noch keine Messung eingetragen',act:'msr-open',v:'',since:new Date((ld?+ld:+BIRTH)+every*DAY)});
  return out;
}

function growthChips(ms){var ks=growthKeys(ms),cur=growthKey(ms);if(ks.length<2)return '';

function chartHTML(ms,k){
  k=k||'cm';
  var pts=chartPts(ms,k);
  if(pts.length<2)return '<p class="tag" style="margin:10px 0 4px">Für den Verlauf beim '+GK[k][0]+' braucht es mindestens zwei Messungen.</p>';
  var vs=pts.map(function(p){return p[1]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),rg=Math.max(mx-mn,k==='kg'?1:4);
  var st=[0.5,1,2,5,10,20].filter(function(x){return rg/x<=5})[0]||20;
  var x0=0,x1=Math.max(12,pts[pts.length-1][0]),y0=Math.floor(mn/st)*st,y1=Math.ceil(mx/st)*st;
  if(y1===y0)y1+=st;
  var W=320,H=150,L=34,B=22,T=10,Rr=10;
  var X=function(v){return L+(v-x0)/(x1-x0)*(W-L-Rr)},Y=function(v){return T+(1-(v-y0)/(y1-y0))*(H-T-B)};
  var grid='';for(var g=y0;g<=y1+1e-9;g+=st)grid+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+fmtNum(Math.round(g*10)/10)+'</text>';
  var xt='';for(var m=0;m<=x1;m+=(x1>24?12:6))xt+='<text x="'+X(m)+'" y="'+(H-6)+'" text-anchor="middle">'+(m%12===0&&m?m/12+' J.':m+' M.')+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+GK[k][0]+' in '+GK[k][1]+' nach Alter">'+grid+xt
   +'<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(function(p){return X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)}).join(' ')+'"/>'
   +pts.map(function(p){return '<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.2" fill="var(--accent)"/>'}).join('')+'</svg>';

function icsFile(){
  /* Einmal laden reicht: alles sind wiederkehrende Termine bis zum 18. Geburtstag.
     Die UIDs sind fest je Kind und Art, ein erneuter Import aktualisiert die Termine statt sie doppelt anzulegen. */
  var n=first(),ev=[],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  function alarm(title,trig){return ['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:'+trig,'END:VALARM']}
  function E(key,d,title,desc,rrule,alarms){
    ev.push(['BEGIN:VEVENT','UID:momenli-'+S.cur+'-'+key+'@momenli','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsDate(d),'DTEND;VALUE=DATE:'+icsDate(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)),
      'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),'TRANSP:TRANSPARENT'].concat(rrule?['RRULE:'+rrule]:[])
      .concat([].concat.apply([],alarms.map(function(a){return alarm(title,a)}))).concat(['END:VEVENT']).join('\r\n'));
  }
  var y=ageYears(TODAY),mo=ageMonths(TODAY);
  if(y<18)E('geburtstag',bday(y+1),n+' hat Geburtstag: Momentitos-Rituale','Brief oder Sprachnachricht an '+n+' schreiben, Mini-Interview führen, Geburtstagsfoto am gewohnten Ort machen, Größe und Gewicht messen. Brief, Interview und Foto in Momentitos unter Rituale, Messung im Steckbrief.','FREQ=YEARLY;COUNT='+(18-y),['-P7D','PT9H']);
  if(mo<mMax())E('monatsfoto',addMonths(BIRTH,mo+1),'Monatsfoto von '+n,'Monatsfoto am gewohnten Ort machen, mit der Kamera in Momentitos liegt das letzte Foto als Vorlage darüber. Unter Rituale speichern.','FREQ=MONTHLY;COUNT='+(mMax()-mo),['PT9H']);
  var a=Math.floor(mo/2)*2+2;if(a<12){E('messen-baby',addMonths(BIRTH,a),'Größe und Gewicht von '+n+' messen','Im ersten Jahr alle zwei Monate. In Momentitos im Steckbrief eintragen.','FREQ=MONTHLY;INTERVAL=2;COUNT='+Math.max(1,Math.floor((12-a)/2)),['PT9H'])}
  if(mo<35){var b=Math.max(16,Math.floor(mo/4)*4+4);if(b<36)E('messen-klein',addMonths(BIRTH,b),'Größe und Gewicht von '+n+' messen','Bis zum 3. Geburtstag alle vier Monate, danach einmal im Jahr zum Geburtstag. In Momentitos im Steckbrief eintragen.','FREQ=MONTHLY;INTERVAL=4;COUNT='+Math.ceil((36-b)/4),['PT9H'])}
  return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Momentitos//DE\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Momentitos '+icsEsc(n)+'\r\n'+ev.join('\r\n')+'\r\nEND:VCALENDAR\r\n';
}

  Object.keys(r.interviews).forEach(function(k){var d=bday(+k);if(d<=TODAY&&Object.keys(r.interviews[k].answers||{}).length)out.push({kind:'iv',date:d,y:+k,I:r.interviews[k],id:9.1e6+ +k})});

  var p=id.split('-'),ph=IDEAS.filter(function(x){return x[0]===p[0]})[0];if(!ph)return null;var r=ph[4][+p[1]];if(!r)return null;
  var o={id:id,type:r[0],t:r.slice(2),ph:ph},k=ideaMs(id);if(k){o.ms=k;o.t=msById(k).label}return o}

function ideaList(pi){
  var ph=IDEAS[pi],rows=ph[4].map(function(r,i){var x={id:ph[0]+'-'+i,type:r[0],t:r.slice(2)},k=ideaMs(x.id);if(k){x.ms=k;x.t=msById(k).label}return x});
  var mapped={};rows.forEach(function(x){if(x.ms)mapped[x.ms]=1});
  var ms=rows.filter(function(x){return x.ms});
  S.ms.forEach(function(m){if(!mapped[m.id]&&msPhase(m)===pi)ms.push({id:'ms:'+m.id,type:'f',t:m.label,ms:m.id,custom:m.custom})});
  var ord={};S.ms.forEach(function(m,i){ord[m.id]=i});ms.sort(function(a,b){return ord[a.ms]-ord[b.ms]});
  return ms.concat(rows.filter(function(x){return !x.ms}));
}

   +right+'</div>';

var HQS=null;
async function hqsLoad(){if(!HQS){try{HQS=(await dbGet('hqsent'))||{}}catch(e){HQS={}}}return HQS}
function hqsSave(){if(HQS)dbPut('hqsent',HQS).catch(function(){})}
function hqForget(id){hqsLoad().then(function(h){delete h[id];hqsSave()})}
async function buildBackup(forSync){
    var media={},hq={},orig={},sent=forSync?await hqsLoad():{};
    var hm=allMem();for(var h=0;h<hm.length;h++){var xp=picsOf(hm[h]);for(var hp=0;hp<xp.length;hp++){var x=xp[hp];if(x.hq&&sent[x.pid]!==sig(x.img)){var pb=await dbGet('photo:'+x.pid);if(pb){hq[x.pid]=await blobToData(pb);if(forSync)sent[x.pid]=sig(x.img)}}
      if(x.orig&&!sent['o:'+x.pid]){var ob=await dbGet('orig:'+x.pid);if(ob){orig[x.pid]=await blobToData(ob);if(forSync)sent['o:'+x.pid]=1}}}}
    var am=allMem();
    for(var i=0;i<am.length;i++){var m=am[i];if(m.media){var b=await dbGet('media:'+m.id);if(b)media[m.id]=await blobToData(b)}}
    var al=allLetters();for(var j=0;j<al.length;j++){if(al[j].mediaId){var lb=await dbGet('media:'+al[j].mediaId);if(lb)media[al[j].mediaId]=await blobToData(lb)}}
    var mu=await dbGet('music'),music=mu&&mu.blob?{name:mu.name,data:await blobToData(mu.blob)}:null;
    return new Blob([JSON.stringify({app:'momenli',v:1,created:new Date().toISOString(),state:snapshot(),media:media,hq:hq,orig:orig,music:music})],{type:'application/json'});
}
async function backup(){
  toast('Sicherung wird erstellt …');
  try{download(await buildBackup(),'Momentitos_Sicherung_'+iso(new Date())+'.json');toast('Sicherung liegt im Download-Ordner')}
  catch(e){toast('Sicherung hat nicht geklappt.')}
}
async function shareSync(){
  toast('Datei wird erstellt …');
  try{
    var blob=await buildBackup(true);hqsSave();var name='Momentitos_Abgleich_'+safeName(first())+'_'+iso(new Date())+'.json';
    var file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Momentitos abgleichen',text:'Öffne Momentitos und spiele diese Datei unter Steckbrief → Mit Partner abgleichen ein.'});toast('Geteilt');return}
      catch(e){if(e&&e.name==='AbortError')return}
    }
    download(blob,name);toast('Datei liegt im Download-Ordner. Schick sie deinem Partner, zum Beispiel per WhatsApp oder Mail.');
  }catch(e){toast('Das hat nicht geklappt.')}
}
function isEmptyLocal(){syncKid();return S.kids.every(function(k){return k.sample||(!k.mem.length&&!(k.profile.name||'').trim())})}
function newer(a,b){return (a&&a.upd||0)>(b&&b.upd||0)}
async function mergeFile(file){
  try{
    var o=JSON.parse(await file.text());
    if(!o||o.app!=='momenli'||!o.state)throw new Error('kein Momentitos');
    if(isEmptyLocal()){await restore(file);return}
    syncKid();
    var hs=await hqsLoad(),rs=o.state,rkids=rs.kids||[{kid:'k1',profile:rs.profile,ms:rs.ms,mem:rs.mem,sample:rs.sample}],media=o.media||{},need=[],added=0,changed=0,newKids=0;
    rkids.forEach(function(rk){
      if(rk.sample)return;
      var lk=S.kids.filter(function(k){return k.kid===rk.kid})[0];
      if(!lk){lk={kid:rk.kid,profile:rk.profile||{},mem:[],ms:rk.ms||[],sample:false,rit:rk.rit||emptyRit(),del:rk.del||{}};S.kids.push(lk);newKids++}
      var del=lk.del=lk.del||{};for(var dk in (rk.del||{}))del[dk]=Math.max(del[dk]||0,rk.del[dk]);
      if(newer(rk.profile,lk.profile))lk.profile=rk.profile;
      (rk.ms||[]).forEach(function(m){if(!del['ms:'+m.id]&&!lk.ms.some(function(x){return x.id===m.id}))lk.ms.push(m)});
      lk.ms=lk.ms.filter(function(m){return !del['ms:'+m.id]});
      (rk.mem||[]).forEach(function(rm){
        if(del['mem:'+rm.id])return;
        fillPics(rm);picsOf(rm).forEach(function(p){if(p.hq)hs[p.pid]=sig(p.img);else delete hs[p.pid];if(p.orig)hs['o:'+p.pid]=1;else delete hs['o:'+p.pid]});/* fehlt dem Partner ein Druckfoto, schicken wir es beim nächsten Mal wieder mit */
        var i=-1;for(var q=0;q<lk.mem.length;q++)if(lk.mem[q].id===rm.id)i=q;
        var nm={};for(var f in rm)nm[f]=rm[f];nm.date=parseISO(rm.date)||TODAY;nm.hq=false;if(rm.pics)nm.pics=rm.pics.map(function(p){var q={pid:p.pid,img:p.img,hq:false};if(p.ed)q.ed=p.ed;return q});
        if(i<0){lk.mem.push(nm);added++;if(rm.media)need.push(rm.id)}
        else if(newer(rm,lk.mem[i])){if(lk.mem[i].url){nm.url=lk.mem[i].url}var lp={};picsOf(lk.mem[i]).forEach(function(p){lp[p.pid]=p});var np={};picsOf(nm).forEach(function(p){np[p.pid]=1;if(lp[p.pid]&&lp[p.pid].hq&&lp[p.pid].img===p.img){if(nm.pics)p.hq=true;else nm.hq=true}if(nm.pics&&lp[p.pid]&&lp[p.pid].orig)p.orig=true});for(var op in lp)if(!np[op]){if(lp[op].hq)dbDel('photo:'+op).catch(function(){});if(lp[op].orig)dbDel('orig:'+op).catch(function(){})}lk.mem[i]=nm;changed++;if(rm.media)need.push(rm.id)}
      });
      lk.mem=lk.mem.filter(function(m){if(del['mem:'+m.id]){if(m.url)URL.revokeObjectURL(m.url);delPics(m);return false}return true});
      var rr=rk.rit||emptyRit(),lr=lk.rit=lk.rit||emptyRit();
      ['letters','interviews'].forEach(function(t){lr[t]=lr[t]||{};for(var y in (rr[t]||{})){if(!lr[t][y]||newer(rr[t][y],lr[t][y])){var keepUrl=lr[t][y]&&lr[t][y].url;lr[t][y]=rr[t][y];if(t==='letters'&&rr[t][y].mediaId){need.push(rr[t][y].mediaId);if(keepUrl)URL.revokeObjectURL(keepUrl)}}}});
      (rr.measures||[]).forEach(function(x){if(!del['msr:'+x.id]&&!lr.measures.some(function(y){return y.id===x.id}))lr.measures.push(x)});
      lr.measures=lr.measures.filter(function(x){return !del['msr:'+x.id]});
      lr.hid=Object.assign({},rr.hid||{},lr.hid||{});
      (rr.qs||[]).forEach(function(x){if(!lr.qs.some(function(y){return y.id===x.id}))lr.qs.push(x)});
    });
    var rhq=o.hq||{};
    for(var hk in rhq){var fp=findPic(hk);if(!fp)continue;
      try{await dbPut('photo:'+hk,await (await fetch(rhq[hk])).blob());if(fp.p)fp.p.hq=true;else fp.m.hq=true;hs[hk]=sig(fp.p?fp.p.img:fp.m.img)}catch(e){}}
    var ror=o.orig||{};for(var ok in ror){var fo=findPic(ok);if(!fo||!fo.p)continue;try{await dbPut('orig:'+ok,await (await fetch(ror[ok])).blob());fo.p.orig=true;hs['o:'+ok]=1}catch(e){}}
    hqsSave();
    for(var n=0;n<need.length;n++){var key=need[n];if(media[key]){var b=await (await fetch(media[key])).blob();await dbPut('media:'+key,b);
      allMem().forEach(function(m){if(String(m.id)===String(key)){if(m.url)URL.revokeObjectURL(m.url);m.url=URL.createObjectURL(b);m.media=true}});
      allLetters().forEach(function(L){if(String(L.mediaId)===String(key)){L.url=URL.createObjectURL(b)}})}}
    S.nextId=Math.max(S.nextId,rs.nextId||0);
    var k0=curKid();S.profile=k0.profile;S.mem=k0.mem;S.ms=k0.ms;S.sample=k0.sample;setBirth();
    await dbPut('state',snapshot());render();
    toast(added||changed||newKids?'Abgeglichen: '+added+' neue und '+changed+' geänderte Momente'+(newKids?', '+newKids+(newKids===1?' neues Kind':' neue Kinder'):''):'Alles war schon auf dem gleichen Stand');
  }catch(e){toast('Diese Datei ist keine gültige Momentitos-Datei.')}
}
async function restore(file){
  try{
    var o=JSON.parse(await file.text());
    if(!o||o.app!=='momenli'||!o.state)throw new Error('kein Momentitos');
    revokeAll();await dbClear();
    for(var k in (o.media||{})){var b=await (await fetch(o.media[k])).blob();await dbPut('media:'+k,b)}
    HQS={};for(var hk in (o.hq||{})){await dbPut('photo:'+hk,await (await fetch(o.hq[hk])).blob());HQS[hk]=1}
    for(var rk in (o.orig||{})){await dbPut('orig:'+rk,await (await fetch(o.orig[rk])).blob());HQS['o:'+rk]=1}
    if(o.music&&o.music.data){var mb=await (await fetch(o.music.data)).blob();await dbPut('music',{blob:mb,name:o.music.name})}
    applySnap(o.state);allMem().forEach(function(m){if(m.pics)m.pics.forEach(function(p){p.hq=!!HQS[p.pid];p.orig=!!HQS['o:'+p.pid];if(p.hq)HQS[p.pid]=sig(p.img)});else{m.hq=!!HQS[m.id];if(m.hq)HQS[m.id]=sig(m.img)}});hqsSave();await dbPut('state',snapshot());await loadMediaUrls();
    S.tab='home';render();toast('Sicherung eingespielt: '+S.kids.length+(S.kids.length===1?' Kind, ':' Kinder, ')+allMem().length+' Momente');
  }catch(e){toast('Diese Datei ist keine gültige Momentitos-Sicherung.')}
}
async function resetAll(sample){
  revokeAll();try{await dbClear()}catch(e){}HQS=null;
  if(custom.el){custom.el.pause();custom.el=null;custom.src=null}
  S.music='spieluhr';S.musicName='';
  if(sample){loadSample();S.tab='home'}else{loadEmpty();S.tab='welcome'}
  save();render();window.scrollTo(0,0);
  toast(sample?'Beispieldaten geladen':'Alles gelöscht');
}

    if(S.add){if(t.id==='a-rit')S.add.rit=t.value;else S.add.ms=t.value}
    if(t.id==='a-rit')refreshCap();
    var ti=$('a-title'),nt=t.value?(t.id==='a-rit'?ritLabel(t.value):msLabel(t.value)):autoTitle();
    if(ti&&(!ti.value.trim()||ti.value===ti.getAttribute('data-auto'))){ti.value=nt;ti.setAttribute('data-auto',nt)}
    if(t.id==='a-rit'&&t.value&&!(S.add&&S.add.edit))$('a-date').value=ritDefaultDate(t.value);
    return}
  if(t.id&&t.id.indexOf('pf-')===0)return;
  if(!t.files||!t.files[0])return;
  var f=t.files[0];
  if(t.id==='imp'){restore(f);t.value='';return}
  if(t.id==='sync-in'||t.id==='w-sync'){mergeFile(f).then(function(){if(t.id==='w-sync'&&!isEmptyLocal()){S.tab='home';render()}});t.value='';return}
  if(t.id==='m-file'){setCustomMusic(f,f.name.replace(/\.[^.]+$/,''));$('fmusic').innerHTML=musicChips();toast('Musik gewählt: '+S.musicName);t.value='';return}
  if(t.id==='lt-file'&&S.lt){var LT=S.lt;LT.blob=f;LT.file=f.name;refreshLt();mediaInfo(f,'s').then(function(o){LT.dur=Math.round(o.dur)||0;if(LT.dur)LT.file=f.name+' · '+mmss(LT.dur*1000);refreshLt()});return}
  if(t.id!=='a-file'||!S.add)return;
  if(S.add.type==='f'){var A=S.add,fl=[].slice.call(t.files),bad=0;t.value='';if(!A.photos.length)applyFileDate(A,fl[0]);A.busy=(A.busy||0)+1;refreshCap();
    (function next(i){if(i>=fl.length){A.busy--;if(bad)toast(bad===1?'Ein Bild kann der Browser nicht lesen.':bad+' Bilder kann der Browser nicht lesen.');refreshCap();return}
      shrink(fl[i],function(url,hq){if(url)A.photos.push({pid:newId(),img:url,hq:false,blob:hq||null,srcFile:fl[i]});else bad++;refreshCap();next(i+1)})})(0)}
  else{applyFileDate(S.add,f);setMedia(f,f.name)}
});

  try{DB=await dbOpen()}catch(e){DB=null}
  var st=null;
  try{st=await dbGet('state')}catch(e){}
  if(st&&(st.mem||st.kids)){applySnap(st);await loadMediaUrls();
    if(S.kids.length===1&&!S.mem.length&&!(S.profile.name||'').trim())S.tab='welcome'}
  else{loadEmpty();S.tab='welcome'}
  if(DB&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  render();
  if(!DB)toast('Hinweis: Dieser Browser speichert hier nicht dauerhaft.');
})();
window.__momenli={S:S,save:save,buildFilm:buildFilm,ed:function(){return ED}};
